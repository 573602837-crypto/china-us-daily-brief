name: Daily News

on:
  schedule:
    # GitHub Actions cron uses UTC. 23:00 UTC is 07:00 in Asia/Shanghai.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Fetch daily news
        timeout-minutes: 25
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          BRIEF_TIMEZONE: Asia/Shanghai
          DISCOVERY_JOB_LIMIT: "250"
          DISCOVERY_METHODS: "rss,sitemap,robots-sitemap,public-page,google-news"
          RESTRICT_TO_PRIMARY_SOURCES: "1"
          ENABLE_OFFICIAL_SOURCES: "0"
          MAX_ARTICLES_PER_SOURCE: "2"
          MAX_ARTICLES_PER_QUERY: "2"
          SOURCE_DISPLAY_LIMIT: "2"
          SOURCE_COVERAGE_ENABLED: "1"
          SOURCE_COVERAGE_TIMESPAN: "3d"
          SOURCE_COVERAGE_MAX_RECORDS: "5"
          GDELT_MIN_INTERVAL_MS: "5500"
        run: npm run fetch:daily

      - name: Commit updated data
        run: |
          git add data/articles data/runs data/source-health
          if git diff --cached --quiet; then
            echo "No news data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ=Asia/Shanghai date +%F)
          git commit -m "chore: update daily news ${DATE}"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/573602837-crypto/china-us-daily-brief.git
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
